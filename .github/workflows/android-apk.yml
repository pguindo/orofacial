name: Android APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        # Los runners ubuntu-latest ya traen el SDK preinstalado ($ANDROID_HOME);
        # solo instalamos lo que pide el proyecto (compileSdk 34 + build-tools de AGP 8.5).
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Ensure stable release keystore
        # Keystore propio versionado en el repo: todas las releases comparten firma
        # y Android permite instalar encima conservando datos. Se genera una sola vez
        # y se guarda en el repo; luego se reutiliza siempre. Imprime su huella SHA-256
        # para comprobar que no cambia entre releases.
        run: |
          KS_PASS="${OROFACIAL_KS_PASS:-orofacial-sideload}"
          if [ ! -f keystore/orofacial.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -storetype PKCS12 -keystore keystore/orofacial.jks \
              -alias orofacial -keyalg RSA -keysize 2048 -validity 9125 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=OrofacialCoach, OU=Personal, O=pguindo"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/orofacial.jks
            git commit -m "CI: keystore estable para firmar releases" || true
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "keystore push skipped"
          fi
          keytool -list -v -keystore keystore/orofacial.jks -storepass "$KS_PASS" 2>/dev/null | grep -E "Alias name|SHA256" || true
        env:
          OROFACIAL_KS_PASS: ${{ secrets.OROFACIAL_KS_PASS }}

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
        env:
          OROFACIAL_KS_PASS: ${{ secrets.OROFACIAL_KS_PASS }}

      - name: Rename APK with version (OrofacialCoach-vX.Y.Z.apk)
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/OrofacialCoach-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrofacialCoach
          path: android/app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: OrofacialCoach
          path: ./dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*.apk
          generate_release_notes: true
